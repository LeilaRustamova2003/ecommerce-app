<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; }
        body { background:#eaeded; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .box { background:white; padding:35px; border-radius:8px; width:350px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
        .logo { text-align:center; font-size:24px; font-weight:bold; color:#febd69; margin-bottom:20px; }
        label { display:block; margin-bottom:5px; font-size:14px; font-weight:bold; }
        input { width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; }
        .btn { width:100%; padding:12px; background:#f0c14b; border:1px solid #a88734; border-radius:4px; font-size:15px; font-weight:bold; cursor:pointer; }
        .error { background:#fff3f3; border:1px solid #e74c3c; color:#c0392b; padding:10px; border-radius:4px; margin-bottom:15px; font-size:13px; }
        .hint { background:#f7f7f7; padding:10px; border-radius:4px; font-size:12px; margin-top:15px; color:#555; }
        .lang-bar { text-align:center; margin-top:15px; font-size:13px; }
        .lang-bar a { color:#007185; text-decoration:none; margin:0 5px; }
    </style>
</head>
<body>
<div class="box">
    <div class="logo" th:text="#{nav.brand}">SmartShop</div>
    <h2 style="text-align:center;margin-bottom:20px;" th:text="#{login.title}">Login</h2>
    <div class="error" th:if="${param.error}" th:text="#{login.error}">Invalid credentials.</div>
    <form th:action="@{/login}" method="post">
        <label th:text="#{login.username}">Username</label>
        <input type="text" name="username" required autofocus>
        <label th:text="#{login.password}">Password</label>
        <input type="password" name="password" required>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn" th:text="#{login.submit}">Sign In</button>
    </form>
    <div class="hint">
        <strong>Demo:</strong><br>
        user / user123<br>
        admin / admin123
    </div>
    <div class="lang-bar">
        <a th:href="@{/login(lang=ka)}" th:text="#{lang.ka}">ქართული</a> |
        <a th:href="@{/login(lang=en)}" th:text="#{lang.en}">English</a>
    </div>
</div>
</body>
</html>
